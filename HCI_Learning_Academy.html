const batchSize=10,totalBatches=Math.ceil(DATA.length/batchSize);
let batch=0, answers={}, checked={};
const $=id=>document.getElementById(id);
const select=$("batchSelect");
for(let i=0;i<totalBatches;i++){let o=document.createElement("option");o.value=i;o.textContent=`Batch ${i+1} (Q${i*10+1}–Q${Math.min((i+1)*10,DATA.length)})`;select.appendChild(o)}
function render(){
 batch=Math.max(0,Math.min(totalBatches-1,batch));select.value=batch;
 $("batchLabel").textContent=`${batch+1} / ${totalBatches}`;
 $("prev").disabled=batch===0;$("next").disabled=batch===totalBatches-1;
 $("questions").innerHTML="";
 const subset=DATA.slice(batch*batchSize,(batch+1)*batchSize);
 subset.forEach(q=>{
  const card=document.createElement("section");card.className="question";
  const wasChecked=!!checked[q.number];
  card.innerHTML=`<div class="qhead"><span>QUESTION ${q.number}</span><span>HCI • Chapter ${Math.ceil(q.number/34)}</span></div>
  <h3>${q.question}</h3>
  <div class="meaning"><b>Asaan meaning:</b> ${q.meaning}</div>
  <div class="options">${Object.entries(q.options).map(([k,v])=>`<label class="opt ${wasChecked&&k===q.answer?'correct':''} ${wasChecked&&answers[q.number]===k&&k!==q.answer?'wrong':''}"><input type="radio" name="q${q.number}" value="${k}" ${answers[q.number]===k?'checked':''} ${wasChecked?'disabled':''}><span><b>${k}.</b> ${v}</span></label>`).join("")}</div>
  <div class="feedback ${wasChecked?'show':''}"><b>Correct answer: ${q.answer}. ${q.options[q.answer]}</b><br><b>Samajh:</b> ${q.explanation}<br><b>Vocabulary:</b> ${q.vocabulary}</div>`;
  card.querySelectorAll("input").forEach(inp=>inp.addEventListener("change",e=>{answers[q.number]=e.target.value;updateStats()}));
  $("questions").appendChild(card);
 });
 $("result").textContent=wasCheckedBatch()?"Batch checked — explanations dekhein.":"";
 updateStats();
}
function wasCheckedBatch(){return DATA.slice(batch*10,(batch+1)*10).every(q=>checked[q.number])}
function updateStats(){
 const attempted=Object.keys(answers).length;
 const correct=DATA.filter(q=>answers[q.number]===q.answer && checked[q.number]).length;
 $("done").textContent=`${attempted} / 200`;$("score").textContent=correct;
 $("bar").style.width=(attempted/200*100)+"%";
}
$("check").onclick=()=>{
 const subset=DATA.slice(batch*10,(batch+1)*10);
 let missing=subset.filter(q=>!answers[q.number]);
 if(missing.length){$("result").textContent=`Pehle ${missing.length} question(s) ka answer select karein.`;return}
 subset.forEach(q=>checked[q.number]=true);
 const got=subset.filter(q=>answers[q.number]===q.answer).length;
 $("result").textContent=`Your score: ${got} / ${subset.length}`;
 render();
};
$("prev").onclick=()=>{batch--;render();window.scrollTo({top:0,behavior:"smooth"})};
$("next").onclick=()=>{batch++;render();window.scrollTo({top:0,behavior:"smooth"})};
select.onchange=()=>{batch=Number(select.value);render();window.scrollTo({top:0,behavior:"smooth"})};
$("reset").onclick=()=>{if(confirm("Reset all answers and progress?")){answers={};checked={};batch=0;render()}};
render();
</script></body></html>
